---
meta:
  default:
    azs: [z1]

params:
  hostname: (( concat genesis.env "-jumpbox" ))
  banner: ~
  hosts: []
  env_vars: {}
  bashrc: ~
  one_time_setup: true
  users: (( param "Set up some users to log into this jumpbox" ))
  distinct_bosh_user: false
  ca_validity_period: 1y
  cert_validity_period: 180d

update:
  canaries: 1
  max_in_flight: 4
  canary_watch_time: 1000-60000
  update_watch_time: 1000-60000
  serial: false

instance_groups:
  - name: jumpbox
    instances: 1
    azs: (( grab params.availability_zones || meta.default.azs ))
    persistent_disk_type: (( grab params.jumpbox_disk_type || params.jumpbox_disk_pool || "jumpbox" ))
    vm_type:              (( grab params.jumpbox_vm_type   || "jumpbox" ))
    stemcell: default
    env:
      bosh:
        remove_dev_tools: true
    networks:
      - name: (( grab params.jumpbox_network || "jumpbox"))
        static_ips: (( static_ips 0 ))
    jobs:
      - name: jumpbox
        release: jumpbox
        properties:
          jumpbox:
            hostname: (( grab params.hostname ))
            users: (( grab params.users ))
            # The jumpbox release renders the banner and the system-wide
            # bashrc straight into the login profile, and BOSH swaps in the
            # job spec default whenever a property arrives as null. The
            # release spells the banner default as `nil`, and YAML reads that
            # as a plain string rather than as a null, so an unset banner used
            # to print a bare `nil` to everyone who logged in. `join ""` turns
            # an unset or null parameter into an empty string, and it passes
            # any value the operator did set straight through.
            banner: (( join "" params.banner ))
            hosts: (( grab params.hosts ))
            bashrc: (( join "" params.bashrc ))
            # The release prompts a new account through a one-time setup on its
            # first login, and it reads the answer from standard input without
            # checking that the shell is interactive. Set this to false when
            # accounts on this jumpbox need to run commands over ssh before
            # anyone has logged into them interactively.
            one_time_setup: (( grab params.one_time_setup ))
            distinct_bosh_user: (( grab params.distinct_bosh_user || false ))
            env:
              TMPDIR: /var/vcap/data/root_tmp
              .: (( inject params.env_vars ))

      - { release: jumpbox, name: inventory       }
#      - { release: toolbelt, name: toolbelt       }
#      - { release: toolbelt, name: toolbelt-quick }


stemcells:
  - alias: default
    os:      (( grab params.stemcell_os      || "ubuntu-jammy" ))
    version: (( grab params.stemcell_version || "latest" ))
