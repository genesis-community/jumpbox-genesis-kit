---
# bpm for ubuntu-resolute.  Loaded by the resolute feature together with the
# wireguard feature, because bpm releases older than 1.4.41 do not compile on
# resolute.  Bump this version together with manifests/releases/bpm.yml,
# because the pipeline updates only that file and the two would drift apart.
# It merges over manifests/releases/bpm.yml by release name.
releases:
- name: bpm
  version: 1.4.45
  url: https://bosh.io/d/github.com/cloudfoundry/bpm-release?v=1.4.45
  sha1: sha256:ff12a6edd6277a571827a26199377adad0d0febb5ab81dc14fbdcfdbd5bc01fb
