exodus:
  bosh: base
  features: ""
  iaas: null
  is_director: false
  scale: null
  services: null
  use_create_env: false
instance_groups:
- azs:
  - z1
  env:
    bosh:
      remove_dev_tools: true
  instances: 1
  jobs:
  - name: jumpbox
    properties:
      jumpbox:
        banner: null
        bashrc: null
        distinct_bosh_user: false
        env:
          TMPDIR: /var/vcap/data/root_tmp
        hostname: base-jumpbox
        hosts: []
        users:
        - name: test-user
          shell: /bin/bash
          ssh_keys:
          - ssh-rsa 1234567890qwertyuiopasdfghjklzxcvbnm
    release: jumpbox
  - name: inventory
    release: jumpbox
  name: jumpbox
  networks:
  - name: jumpbox
    static_ips:
    - 10.99.0.16
  persistent_disk_type: jumpbox
  stemcell: default
  vm_type: jumpbox
name: base-jumpbox
releases:
- name: jumpbox
  sha1: 3257fd5b24c624889897f2104672e7cca49fc82e
  url: https://github.com/cloudfoundry-community/jumpbox-boshrelease/releases/download/v5.1.3/jumpbox-5.1.3.tgz
  version: 5.1.3
- name: toolbelt
  sha1: 9ef47e3aa0f9b22a4186df675f3c223fe3a6d847
  url: https://github.com/cloudfoundry-community/toolbelt-boshrelease/releases/download/v4.0.0/toolbelt-4.0.0.tgz
  version: 4.0.0
stemcells:
- alias: default
  os: ubuntu-jammy
  version: latest
update:
  canaries: 1
  canary_watch_time: 1000-60000
  max_in_flight: 4
  serial: false
  update_watch_time: 1000-60000
